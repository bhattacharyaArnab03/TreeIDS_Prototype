pipeline:
  mode: "batch"  # Options: "batch" (telemetry CSV ingestion) | "live" (Scapy real-time streaming)

dataset:
  raw_dir: "data/raw"
  dataset_type: "auto"  # Options: "auto", "cic_ids2017", "unsw_nb15", "generic"
  active_day: "Friday_DDoS"  # Options: Monday, Tuesday, Wednesday, Thursday_WebAttacks, Thursday_Infiltration, Friday_PortScan, Friday_Botnet, Friday_DDoS, Friday_Combined, etc.

  files:
    # Single-file days
    Monday: "Monday-WorkingHours.pcap_ISCX.csv"
    Tuesday: "Tuesday-WorkingHours.pcap_ISCX.csv"
    Wednesday: "Wednesday-workingHours.pcap_ISCX.csv"

    # Thursday (Individual sessions or merged)
    Thursday_WebAttacks: "Thursday-WorkingHours-Morning-WebAttacks.pcap_ISCX.csv"
    Thursday_Infiltration: "Thursday-WorkingHours-Afternoon-Infilteration.pcap_ISCX.csv"
    Thursday_Combined:
      - "Thursday-WorkingHours-Morning-WebAttacks.pcap_ISCX.csv"
      - "Thursday-WorkingHours-Afternoon-Infilteration.pcap_ISCX.csv"

    # Friday (Individual sessions or merged)
    Friday_Botnet: "Friday-WorkingHours-Morning.pcap_ISCX.csv"
    Friday_PortScan: "Friday-WorkingHours-Afternoon-PortScan.pcap_ISCX.csv"
    Friday_DDoS: "Friday-WorkingHours-Afternoon-DDos.pcap_ISCX.csv"
    Friday_Combined:
      - "Friday-WorkingHours-Morning.pcap_ISCX.csv"
      - "Friday-WorkingHours-Afternoon-PortScan.pcap_ISCX.csv"
      - "Friday-WorkingHours-Afternoon-DDos.pcap_ISCX.csv"

  processed_tree_path: "data/processed/tree_index.json"
  sample_size: 1000  # Representative sampling across active day

live_capture:
  interface: '\Device\NPF_Loopback'  # Npcap loopback for localhost simulation tests
  bpf_filter: "ip and (tcp or udp or icmp)"
  window_duration_sec: 10.0
  flow_timeout_sec: 30.0
  max_queue_size: 10000

tree_builder:
  max_flows_per_leaf: 10
  max_sessions_eval: 10
  groupby_columns:
    - "src_ip"
    - "dst_ip"
    - "dst_port"

tree_pruning:
  enabled: true
  min_flow_count: 2
  min_forward_packets: 50
  retain_ports: [21, 22, 23, 25, 53, 80, 110, 135, 139, 143, 443, 445, 1433, 3306, 3389, 8080, 8443]

llm:
  provider: "mock"  # Options: "mock" (offline rule heuristics) | "cascade" (Groq Cloud API with mock fallback)
  primary_model: "qwen/qwen3.8-27b"  # Primary Groq Cloud model (Qwen 27B)
  secondary_model: "openai/gpt-oss-20b"  # Secondary Groq Cloud fallback model (GPT-OSS 20B)
  fallback_to_mock: true
  temperature: 0.1

output:
  results_path: "outputs/detection_results.json"
  audit_log_path: "outputs/classification_audit.log"
  audit_jsonl_path: "outputs/audit_log.jsonl"

